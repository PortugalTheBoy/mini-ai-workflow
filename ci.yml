name: KI-Workflow

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Modell trainieren und auf Testdaten bewerten
        run: python workflow.py train

      - name: Beispielanfrage klassifizieren
        run: python workflow.py predict --text "Meine Rechnung wurde doppelt abgebucht"

      - name: Bericht und Beispielprotokoll speichern
        uses: actions/upload-artifact@v4
        with:
          name: ki-workflow-ergebnisse
          path: |
            artifacts/metrics.json
            logs/predictions.jsonl
          if-no-files-found: error
          retention-days: 7
